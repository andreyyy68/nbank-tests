name: Build and Run Tests

on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set commit hash
        id: vars
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker image with tests
        run: docker build -t andreyyy68/nbank-test:${COMMIT_HASH} -f infra/docker_compose/Dockerfile .

      - name: Push Docker image
        run: docker push andreyyy68/nbank-test:${COMMIT_HASH}

      - name: Run tests with docker-compose
        run: |
          chmod +x infra/docker_compose/run-tests-with-docker-compose.sh
          cd infra/docker_compose
          bash -x ./run-tests-with-docker-compose.sh